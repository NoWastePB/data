name: Afvalkalender

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 1 * *"   # elke 1e van de maand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pypdf
      - run: python scrapers/omrin_afvalkalender.py
      - name: Commit als er iets veranderd is
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/afvalkalender.json
          git diff --cached --quiet || git commit -m "Update afvalkalender" && git push
